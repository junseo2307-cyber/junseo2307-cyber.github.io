<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>공부 타이머</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <nav>
    <ul class="menu">
      <li id="menuTimer" class="active">타이머</li>
      <li id="menuCalendar">달력</li>
      <li>미정</li>
    </ul>
    <button class="login-btn" id="loginBtn">로그인</button>
  </nav>
</header>

<main>
  <!-- 타이머 -->
  <section id="timer-section">
    <p class="label">목표 시간</p>
    <input type="number" id="goalHour" placeholder="시간" /> 시간
    <input type="number" id="goalMin" placeholder="분" /> 분

    <div id="time">00:00:00</div>
    <button id="startBtn">▶</button>
  </section>

  <!-- 캘린더 -->
  <section id="calendar-section" class="hidden">
    <div class="calendar-header">
      <button id="prevMonth" class="month-btn" aria-label="이전 달">◀</button>
      <div id="monthLabel" aria-live="polite"></div>
      <button id="nextMonth" class="month-btn" aria-label="다음 달">▶</button>
    </div>
    <div id="selectedDateInfo" class="date-info" aria-live="polite"></div>
    <div class="calendar" id="calendarGrid" aria-label="월별 달력"></div>
  </section>

  
</main>

<!-- 로그인 모달 -->
<div id="loginModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
  <div class="modal-content">
    <button class="modal-close" aria-label="닫기">×</button>
    <h2 id="loginTitle">로그인</h2>
    <form id="loginForm">
      <label for="loginId">아이디</label>
      <input type="text" id="loginId" name="loginId" required />

      <label for="password">비밀번호</label>
      <input type="password" id="password" name="password" required />

      <div class="error-message" id="loginError" aria-live="polite"></div>

      <button type="submit">로그인</button>
      <div class="form-actions">
        <button type="button" id="openSignupBtn" class="secondary">회원가입</button>
      </div>
    </form>
  </div>
</div>

<!-- 회원가입 모달 -->
<div id="signupModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="signupTitle">
  <div class="modal-content">
    <button class="modal-close" aria-label="닫기">×</button>
    <h2 id="signupTitle">회원가입</h2>
    <form id="signupForm">
      <label for="signupId">아이디</label>
      <input type="text" id="signupId" name="signupId" required />

      <label for="signupPassword">비밀번호</label>
      <input type="password" id="signupPassword" name="signupPassword" required />

      <label for="signupPasswordConfirm">비밀번호 재확인</label>
      <input type="password" id="signupPasswordConfirm" name="signupPasswordConfirm" required />

      <div class="error-message" id="signupError" aria-live="polite"></div>

      <div style="display:flex;gap:8px;margin-top:8px">
        <button type="submit">확인</button>
        <button type="button" id="cancelSignup">취소</button>
      </div>
    </form>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
